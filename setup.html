<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>My Lock Setup</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#e8ecf8;font-family:system-ui,sans-serif}
.box{width:min(380px,92vw);display:flex;flex-direction:column;gap:12px;text-align:center}
input{padding:13px;border-radius:10px;border:1px solid #2a3355;background:#141b33;color:#e8ecf8;font-size:16px;text-align:center}
button{padding:12px;border:0;border-radius:10px;background:#5b8cff;color:#fff;font-size:16px;cursor:pointer}
#m{min-height:20px;font-size:14px}
</style></head>
<body><div class="box">
<div style="font-size:42px">🛡️</div><h2 style="margin:0">Set your password</h2>
<input id="old" type="password" placeholder="Current password (skip if first time)">
<input id="p1" type="password" placeholder="New password (min 4)">
<input id="p2" type="password" placeholder="Repeat new password">
<button id="b">Save</button><div id="m"></div>
<div style="color:#8d97b5;font-size:13px">Chrome will lock when it opens and after 3 minutes of inactivity.</div>
</div><script src="setup.js"></script><script src="lock.js"></script></body></html>
